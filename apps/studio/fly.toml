# fly.toml app configuration file generated for eduksource-studio on 2026-08-10T18:20:23Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'eduksource-studio'
primary_region = 'sin'

[build]
  dockerfile = './Dockerfile'
  ignorefile = '../../.dockerignore'

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
